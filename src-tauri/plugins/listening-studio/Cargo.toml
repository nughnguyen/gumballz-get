[package]
name = "gumballz-get-plugin-listening-studio"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
gumballz-plugin-sdk = { path = "../../gumballz-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sanitize-filename = "0.6"
