[package]
name = "gumballz-get-plugin-asset-forge"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# `dynamic` gates the `#[no_mangle]` C exports emitted by `export_plugin!`
# (ABI version / build info / init). It is intentionally NOT a default
# feature: the app crate links this crate as an rlib, and every rlib that
# defines those three symbols breaks the Windows link (LNK2005). Only a
# standalone cdylib build enables it (`--features dynamic`).
dynamic = []

[dependencies]
anyhow = "1"
gumballz-plugin-sdk = { path = "../../gumballz-plugin-sdk" }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sanitize-filename = "0.6"
