[package]
name = "gumballz-get-plugin-convert"
version = "1.0.3"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]


[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
gumballz-core = { path = "../../gumballz-core", features = ["desktop"] }
gumballz-plugin-sdk = { path = "../../gumballz-plugin-sdk" }
