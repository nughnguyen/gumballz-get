name: CI

on:
  push:
    branches: [main, dev, rebrand, v1]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'weblate' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libpipewire-0.3-dev clang libclang-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri'

      - name: Test
        if: matrix.platform != 'windows-latest'
        working-directory: src-tauri
        run: cargo test --workspace

      - name: Test (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: src-tauri
        run: cargo test --workspace --exclude gumballz-get-plugin-courses

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: svelte-check
        run: pnpm check

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Locales in sync with en.json
        run: pnpm check:i18n

  metainfo:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'weblate' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install appstreamcli
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream

      - name: Validate flatpak metainfo
        run: appstreamcli validate flatpak/com.gumballz.get.metainfo.xml
