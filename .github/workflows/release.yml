name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish-tauri:
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            cli_target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            cli_target: 'x86_64-unknown-linux-gnu'
            args: '-- --no-default-features'
          - platform: 'windows-latest'
            cli_target: 'x86_64-pc-windows-msvc'
            args: ''

    runs-on: ${{ matrix.platform }}
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libpipewire-0.3-dev clang libclang-dev patchelf xdg-utils
          sudo apt-get install -y gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Seed patched linuxdeploy-plugin-gtk (Ubuntu only)
        if: contains(matrix.platform, 'ubuntu')
        run: |
          mkdir -p ~/.cache/tauri
          cp scripts/linux/linuxdeploy-plugin-gtk.sh ~/.cache/tauri/linuxdeploy-plugin-gtk.sh
          chmod +x ~/.cache/tauri/linuxdeploy-plugin-gtk.sh

      - uses: tauri-apps/tauri-action@v0
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LDAI_UPDATE_INFORMATION: ${{ contains(matrix.platform, 'ubuntu') && 'gh-releases-zsync|nughnguyen|gumballz-get|latest|*AppImage.zsync' || '' }}
          NO_STRIP: ${{ contains(matrix.platform, 'ubuntu') && '1' || '' }}
          NODE_OPTIONS: --max-old-space-size=6144
        with:
          tagName: v__VERSION__
          releaseName: 'GumballZ Get v__VERSION__'
          releaseBody: |
            ## Downloads

            **Windows**: `.exe` installer or portable.
            **macOS**: `.dmg` (Apple Silicon `aarch64`).
            **Linux**: `.AppImage` (universal) or `.deb` (Debian/Ubuntu).

            ---

            ### Debian/Ubuntu users: AppImage compatibility

            **Debian 12+ ships without FUSE 2 by default**, which AppImage requires.
            If `./gumballz-get.AppImage` fails with a libfuse error, run:

            ```bash
            sudo apt install libfuse2
            ```

            ...or use `./gumballz-get.AppImage --appimage-extract-and-run`.

            **Easier alternative**: download the `.deb` instead, which works out of the
            box on Debian 12+ and Ubuntu 22.04+.

            ---

            ### macOS users: "GumballZ Get is damaged and can't be opened"

            The app is not notarized with Apple yet, so Gatekeeper quarantines it.
            After moving the app to `/Applications`, run:

            ```bash
            xattr -cr /Applications/gumballz-get.app
            ```

            Then open it normally. If it still refuses, allow it under
            **System Settings → Privacy & Security**.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Verify bundled AppImage media plugins
        if: contains(matrix.platform, 'ubuntu')
        run: |
          for appdir in src-tauri/target/release/bundle/appimage/*.AppDir; do
            bash scripts/linux/verify-appimage-media.sh "$appdir"
          done

      - name: Generate and upload AppImage zsync files
        if: contains(matrix.platform, 'ubuntu')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get install -y zsync
          TAG="${GITHUB_REF#refs/tags/}"
          for appimage in src-tauri/target/release/bundle/appimage/*.AppImage; do
            if [ -f "$appimage" ]; then
              zsyncmake "$appimage" -o "${appimage}.zsync" -u "$(basename "$appimage")"
              gh release upload "$TAG" "${appimage}.zsync" --repo "${{ github.repository }}" --clobber
            fi
          done

      - name: Upload unsigned Windows NSIS installer
        if: matrix.platform == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        id: upload-unsigned-setup
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-setup
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: warn

      - name: Sign Windows NSIS installer via SignPath
        if: matrix.platform == 'windows-latest' && env.SIGNPATH_API_TOKEN != '' && steps.upload-unsigned-setup.outputs.artifact-id != ''
        continue-on-error: true
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: '773e0b25-f263-45c9-8f29-c7a6a1aed6db'
          project-slug: 'gumballz-get'
          signing-policy-slug: 'release-signing'
          github-artifact-id: ${{ steps.upload-unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: 'src-tauri/target/release/bundle/nsis-signed'

      - name: Publish signed Windows installer to release
        if: matrix.platform == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $TAG = "${{ github.ref_name }}"
          $SIGNED_SETUP = Get-ChildItem "src-tauri/target/release/bundle/nsis-signed" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($SIGNED_SETUP) {
            Write-Host "Found SignPath-signed setup installer: $($SIGNED_SETUP.FullName)"
            if ($env:TAURI_SIGNING_PRIVATE_KEY) {
              Write-Host "Re-signing updater signature for signed installer..."
              pnpm tauri signer sign $SIGNED_SETUP.FullName
              $SIG_FILE = "$($SIGNED_SETUP.FullName).sig"
              if (Test-Path $SIG_FILE) {
                gh release upload $TAG $SIG_FILE --repo ${{ github.repository }} --clobber
              }
            }
            gh release upload $TAG $SIGNED_SETUP.FullName --repo ${{ github.repository }} --clobber
            Write-Host "Successfully published signed installer to release $TAG"
          } else {
            Write-Host "No signed installer found in nsis-signed directory; keeping draft installer."
          }
        shell: pwsh

      - name: Upload unsigned Windows portable binary
        if: matrix.platform == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        id: upload-unsigned-portable
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-portable
          path: src-tauri/target/release/gumballz-get.exe
          if-no-files-found: warn

      - name: Sign Windows portable binary via SignPath
        if: matrix.platform == 'windows-latest' && env.SIGNPATH_API_TOKEN != '' && steps.upload-unsigned-portable.outputs.artifact-id != ''
        continue-on-error: true
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: '773e0b25-f263-45c9-8f29-c7a6a1aed6db'
          project-slug: 'gumballz-get'
          signing-policy-slug: 'release-signing'
          github-artifact-id: ${{ steps.upload-unsigned-portable.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: 'src-tauri/target/release/portable-signed'

      - name: Upload Windows portable binary
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $TAG = "${{ github.ref_name }}"
          $VERSION = $TAG -replace '^v', ''
          $SIGNED_PORTABLE = Get-ChildItem "src-tauri/target/release/portable-signed" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $SRC = if ($SIGNED_PORTABLE) { $SIGNED_PORTABLE.FullName } else { "src-tauri/target/release/gumballz-get.exe" }
          $DEST = "gumballz-get_${VERSION}_x64-portable.exe"
          if (Test-Path $SRC) {
            Write-Host "Uploading portable binary from $SRC to $DEST..."
            Copy-Item $SRC $DEST
            gh release upload $TAG $DEST --repo ${{ github.repository }} --clobber
          }
        shell: pwsh

      - name: Package and upload CLI (Unix)
        if: matrix.platform != 'windows-latest' && matrix.cli_target != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            cargo build -p gumballz-cli --release --target ${{ matrix.cli_target }} --manifest-path src-tauri/Cargo.toml
            BIN="src-tauri/target/${{ matrix.cli_target }}/release/gumballz-cli"
          else
            cargo build -p gumballz-cli --release --manifest-path src-tauri/Cargo.toml
            BIN="src-tauri/target/release/gumballz-cli"
          fi
          test -x "$BIN"
          "$BIN" --version
          OUT="gumballz-cli-${VERSION}-${{ matrix.cli_target }}.tar.gz"
          tar -czf "$OUT" -C "$(dirname "$BIN")" gumballz-cli
          gh release upload "$TAG" "$OUT" --repo "${{ github.repository }}" --clobber

      - name: Package and upload CLI (Windows)
        if: matrix.platform == 'windows-latest' && matrix.cli_target != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $TAG = "${{ github.ref_name }}"
          $VERSION = $TAG -replace '^v', ''
          cargo build -p gumballz-cli --release --manifest-path src-tauri/Cargo.toml
          $BIN = "src-tauri/target/release/gumballz-cli.exe"
          if (-not (Test-Path $BIN)) { throw "Binary not found: $BIN" }
          & $BIN --version
          $OUT = "gumballz-cli-${VERSION}-${{ matrix.cli_target }}.zip"
          Compress-Archive -Path $BIN -DestinationPath $OUT -Force
          gh release upload $TAG $OUT --repo ${{ github.repository }} --clobber
        shell: pwsh

  package-chrome-extension:
    # Independent of the Tauri build: package the extension even if a
    # platform build failed, otherwise a cancelled macOS job (v1.0.0)
    # silently drops the extension from the release.
    if: always()
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Package Chrome extension
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          OUTPUT="gumballz-get-chrome-extension-v${VERSION}.zip"
          node browser-extension/chrome/scripts/package.mjs --version "$VERSION" --output "$OUTPUT"
          gh release upload "$TAG" "$OUTPUT" --repo "${{ github.repository }}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-updater-json:
    # Build latest.json from whatever .sig assets exist in the release,
    # even if a platform build failed — otherwise one cancelled job
    # (v1.0.0 macOS) leaves the in-app updater with no latest.json.
    if: always()
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured. Skipping latest.json generation."
            exit 0
          fi

          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          REPO="${GITHUB_REPOSITORY}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          JSON=$(jq -n \
            --arg v "$VERSION" \
            --arg d "$PUB_DATE" \
            '{version: $v, notes: "", pub_date: $d, platforms: {}}')

          declare -A PLATFORM_MAP=(
            ["aarch64.app.tar.gz.sig"]="darwin-aarch64"
            ["amd64.AppImage.sig"]="linux-x86_64"
            ["x64-setup.exe.sig"]="windows-x86_64"
          )

          ASSETS=$(gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name' || true)
          TMPDIR=$(mktemp -d)

          for SUFFIX in "${!PLATFORM_MAP[@]}"; do
            PLATFORM="${PLATFORM_MAP[$SUFFIX]}"
            SIG_FILE=$(echo "$ASSETS" | grep "${SUFFIX}$" || true)

            if [ -n "$SIG_FILE" ]; then
              BUNDLE="${SIG_FILE%.sig}"
              if gh release download "$TAG" --repo "$REPO" --pattern "$SIG_FILE" --dir "$TMPDIR" --clobber; then
                SIG_CONTENT=$(cat "$TMPDIR/$SIG_FILE")
                URL="https://github.com/${REPO}/releases/download/${TAG}/${BUNDLE}"
                JSON=$(echo "$JSON" | jq \
                  --arg p "$PLATFORM" \
                  --arg sig "$SIG_CONTENT" \
                  --arg url "$URL" \
                  '.platforms[$p] = {signature: $sig, url: $url}')
              fi
            fi
          done

          echo "$JSON" > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
          rm -rf "$TMPDIR"
